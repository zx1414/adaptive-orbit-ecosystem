name: 发布社区扩展
description: 自助公开发布机制 Mod、决策算法或材质包
title: "[玩家扩展] "
labels: [community-extension]
body:
  - type: markdown
    attributes:
      value: 在标题写上作品名称。提交后，作品和下载地址会出现在扩展库的玩家发布区。
  - type: dropdown
    id: kind
    attributes:
      label: 扩展类别
      options:
        - 机制 Mod
        - 决策模型或研究算法
        - 材质包
    validations:
      required: true
  - type: input
    id: game-version
    attributes:
      label: 已试用的游戏版本
      placeholder: "例如 3.2.1"
    validations:
      required: true
  - type: textarea
    id: download
    attributes:
      label: 下载地址
      description: 粘贴无需登录即可打开的 HTTPS 下载链接，或把 ZIP 文件拖到这里上传。
    validations:
      required: true
  - type: textarea
    id: submission
    attributes:
      label: 作品介绍
      description: 写下作品用途、扩展版本和授权方式。有源码的话可以附上链接。
    validations:
      required: true
  - type: textarea
    id: usage
    attributes:
      label: 安装或复现方法
      description: 说明文件放在哪里、如何启用。实验结果可附种子、场景及观察到的变化。
    validations:
      required: true
